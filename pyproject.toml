[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cricketiq"
version = "0.1.0"
description = "CricketIQ — ICC & MCC Cricket Rules Intelligence Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
embeddings = [
    "sentence-transformers>=2.6.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
]

[tool.pytest.ini_options]
testpaths = ["cricketiq/backend/tests"]
python_files = ["test_*.py"]
